<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/puma-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puma Estaciones</title>
    <script>
      // Applies the saved or system theme before the first paint (avoids a flash).
      try {
        var saved = localStorage.getItem('puma-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
